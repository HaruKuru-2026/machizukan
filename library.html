<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>まちの精霊図鑑 - 図鑑</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 発見画面 -->
    <div id="discover-screen" style="display: none;">

        <div class="discover-content">

            <div class="discover-sparkles">
                ✨　✦　✨
            </div>

            <p class="discover-label">
                NEW SPIRIT DISCOVERED
            </p>

            <h1>発見！</h1>

            <img
                id="discover-image"
                src=""
                alt="発見した精霊"
            >

            <h2 id="discover-name"></h2>

            <p id="discover-desc"></p>

            <div id="discover-details">

                <p>
                    <strong>✨ 必殺技</strong><br>
                    <span id="discover-skill"></span>
                </p>

                <p>
                    <strong>💬 口ぐせ</strong><br>
                    <span id="discover-catchphrase"></span>
                </p>

                <p>
                    <strong>📍 好きな場所</strong><br>
                    <span id="discover-favorite-place"></span>
                </p>

                <p>
                    <strong>🎨 作者</strong><br>
                    <span id="discover-author"></span>
                </p>

            </div>

            <button onclick="closeDiscoverScreen()">
                図鑑を見る
            </button>

        </div>

    </div>


    <main class="library-page">

        <!-- トップへ戻る -->
        <a href="index.html" class="back-button">
            ← トップへ戻る
        </a>


        <!-- 図鑑ヘッダー -->
        <header class="library-header">

            <div class="library-decoration">
                🌿　🌹　📖　🌹　🌿
            </div>

            <h1>まちの精霊図鑑</h1>

            <p>
                街に隠れた精霊たちを探そう
            </p>

        </header>


        <!-- 開発中表示 -->
        <div class="dev-warning">
            ⚠ 試作版（開発中）
        </div>


        <!-- 発見数・開発用ボタン -->
        <div class="library-tools">

            <p id="count">
                発見数 0 / 15
            </p>

            <button
                class="reset-button"
                onclick="resetData()"
            >
                データをリセット
            </button>

        </div>


        <!-- キャラクター一覧 -->
        <!-- JavaScriptがここに自動生成します -->
        <section
            id="character-list"
            class="character-list"
        ></section>

        <!-- キャラクター詳細画面 -->
<div id="character-detail-screen" style="display: none;">

    <div class="character-detail-content">

        <button
            class="detail-close-button"
            onclick="closeCharacterDetail()"
        >
            ×
        </button>

        <p id="detail-number"></p>

        <h1 id="detail-name"></h1>

        <img
            id="detail-image"
            src=""
            alt=""
            onclick="openBigImage()"
        >

        <p class="image-hint">
            画像をタップすると大きく見られます
        </p>

        <p id="detail-desc"></p>

        <div id="detail-info">

            <p>
                <strong>✨ 必殺技</strong><br>
                <span id="detail-skill"></span>
            </p>

            <p>
                <strong>💬 口ぐせ</strong><br>
                <span id="detail-catchphrase"></span>
            </p>

            <p>
                <strong>📍 好きな場所</strong><br>
                <span id="detail-favorite-place"></span>
            </p>

            <p>
                <strong>🎨 作者</strong><br>
                <span id="detail-author"></span>
            </p>

        </div>

    </div>

</div>


    <!-- 大きな画像表示 -->
    <div
        id="big-image-screen"
        style="display: none;"
        onclick="closeBigImage()"
    >

        <img
            id="big-image"
            src=""
            alt=""
        >

        <p>タップして閉じる</p>

    </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
